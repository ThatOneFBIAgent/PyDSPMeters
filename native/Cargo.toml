[package]
name = "dsp_accel"
version = "0.1.0"
edition = "2021"

[lib]
name = "dsp_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38"] }
numpy = { version = "0.28", features = ["abi3"] }
rustfft = "6.4.1"

[profile.release]
opt-level = 3
lto = true
