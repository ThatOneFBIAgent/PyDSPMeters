[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "dsp_accel"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
+
+[tool.maturin]
+features = ["pyo3/abi3-py38"]
+module-name = "dsp_accel"
+compatibility = "abi3"
+
+[tool.cibuildwheel]
+build-frontend = "pip"
+build = "cp38-*"
+# abi3 wheels are compatible with all 3.8+ versions, so we only need to build once
+skip = "cp36-* cp37-* cp39-* cp310-* cp311-* cp312-* cp313-* pp*"
+
+[tool.cibuildwheel.linux]
+before-all = "curl https://sh.rustup.rs -sSf | sh -s -- -y"
+environment = { PATH = "$PATH:$HOME/.cargo/bin" }
+
+[tool.cibuildwheel.windows]
+before-build = "pip install maturin"


